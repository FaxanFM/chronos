name: Control Room

on:
  push:
    paths:
      - experimental/orchestrator/**
      - plugins/chronos/.codex-plugin/plugin.json
      - plugins/chronos/skills/chronos-control-room/**
      - scripts/build-control-room-payload.mjs
      - .github/workflows/control-room.yml
  pull_request:
    paths:
      - experimental/orchestrator/**
      - plugins/chronos/.codex-plugin/plugin.json
      - plugins/chronos/skills/chronos-control-room/**
      - scripts/build-control-room-payload.mjs
      - .github/workflows/control-room.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Protocol, queue and loopback boundaries (no model usage)
        run: node --test experimental/orchestrator/tests/*.test.mjs
      - name: Install pinned frontend build dependencies
        run: npm ci --prefix experimental/orchestrator
      - name: Verify committed frontend bundle
        run: |
          npm --prefix experimental/orchestrator run build
          git diff --exit-code -- experimental/orchestrator/public
      - name: Verify committed plugin runtime payload
        shell: bash
        run: |
          node scripts/build-control-room-payload.mjs
          git diff --exit-code -- plugins/chronos/skills/chronos-control-room/scripts/runtime
      - name: Verify packaged payload and entrypoint
        run: node --test experimental/orchestrator/tests/packaging.test.mjs
