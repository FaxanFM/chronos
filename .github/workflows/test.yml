name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test Chronos
        shell: powershell
        run: .\tests\chronos.tests.ps1 -PythonPath python
      - name: Test Chronos Governor
        shell: powershell
        run: .\tests\governor.tests.ps1
      - name: Test reproducible release
        shell: powershell
        run: .\tests\release.tests.ps1
