name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $failures = @()
          foreach ($file in @(Get-ChildItem -Recurse -Filter *.ps1 -File)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failures += @($errors | ForEach-Object { "$($file.FullName): $($_.Message)" }) }
          }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Parse JSON manifests
        shell: powershell
        run: |
          Get-Content -Raw .agents/plugins/marketplace.json | ConvertFrom-Json | Out-Null
          Get-Content -Raw plugins/chronos/.codex-plugin/plugin.json | ConvertFrom-Json | Out-Null
          Get-Content -Raw plugins/chronos/hooks/hooks.json | ConvertFrom-Json | Out-Null
      - name: Test Chronos
        shell: powershell
        run: .\tests\chronos.tests.ps1 -PythonPath python
      - name: Test packaged Chronos Heartbeats
        shell: powershell
        run: |
          $version = [string](Get-Content -Raw plugins/chronos/.codex-plugin/plugin.json | ConvertFrom-Json).version
          $build = Join-Path $env:RUNNER_TEMP 'chronos-heartbeat-build'
          $package = Join-Path $env:RUNNER_TEMP 'chronos-heartbeat-package'
          .\scripts\build-release.ps1 -Version $version -OutputDirectory $build
          Expand-Archive -LiteralPath (Join-Path $build "chronos-v$version.zip") -DestinationPath $package
          .\tests\heartbeat.tests.ps1 -PluginRoot $package
      - name: Test Chronos Supervision
        shell: powershell
        run: .\tests\supervision.tests.ps1
      - name: Test Chronos Governor
        shell: powershell
        run: .\tests\governor.tests.ps1
      - name: Test reproducible release
        shell: powershell
        run: .\tests\release.tests.ps1
