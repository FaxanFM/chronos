name: Share a sanitized Chronos result
description: Share an opt-in, privacy-checked outcome without uploading local diagnostic files.
title: "[Result]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Share aggregate or synthetic information only. Never attach rollout files, SQLite files, Governor state, source, commands, credentials, usernames, absolute paths, task IDs, or private workspace details.
  - type: input
    id: version
    attributes:
      label: Chronos version
      placeholder: 0.8.4
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: What were you trying to understand or improve?
      description: Use a generic workload description and omit project or customer names.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What did Chronos help you identify or decide?
      description: Describe the outcome without claiming billing savings, SSD damage, or causation that the evidence does not prove.
    validations:
      required: true
  - type: textarea
    id: aggregate
    attributes:
      label: Optional sanitized aggregate output
      description: Paste only reviewed CHRONOS aggregate fields. Remove timestamps if they could identify activity.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Optional sanitized screenshot
      description: Attach only a cropped or synthetic image after removing account, task, path, prompt, command, and workspace details.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-sharing check
      options:
        - label: I did not attach raw Chronos inputs, Codex diagnostic files, rollout files, SQLite files, or Governor state.
          required: true
        - label: I removed personal data, paths, IDs, prompts, commands, credentials, source, and private workspace details.
          required: true
        - label: I understand this issue and any attached screenshot will be public.
          required: true
